kind = "mobile"
previewPath = "/driver/"
title = "EcoRide Driver"
version = "1.0.0"
id = "artifacts/driver"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/driver/" ]
localPort = 21523

[services.development]
run = "pnpm --filter @workspace/driver run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/driver", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/driver", "run", "serve" ]

[services.env]
PORT = "21523"
BASE_PATH = "/driver/"
